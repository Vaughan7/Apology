<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>I'm Sorry</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #ffe6e6, #ffcccc);
      color: #b30000;
      text-align: center;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto 30px;
      animation: fadeIn 3s ease-in-out;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.3s ease;
      animation: fadeIn 4s ease-in-out;
    }

    button:hover {
      transform: scale(1.1);
    }

    #message {
      font-size: 1.5em;
      margin-top: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .petal {
      position: absolute;
      width: 20px;
      height: 20px;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/6d/Rose_petal_icon.png');
      background-size: cover;
      animation: fall 10s linear infinite;
      opacity: 0.8;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>I'm Sorry ❤️</h1>
  <p>I know I hurt you, and I'm truly sorry.</p>
  <button onclick="showLove()">Forgive me?🥺👉🏽👈🏽</button>
  <p id="message"></p>

  <script>
    function showLove() {
      const msg = document.getElementById("message");
      msg.textContent = "Thank you ❤️ I promise to not only do better, but to be a better boyfriend. And always fight for our love.";
    }

    // Create rose petals
    for (let i = 0; i < 30; i++) {
      let petal = document.createElement("div");
      petal.className = "petal";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.animationDelay = Math.random() * 10 + "s";
      petal.style.animationDuration = 5 + Math.random() * 5 + "s";
      document.body.appendChild(petal);
    }
  </script>
</body>
</html>
